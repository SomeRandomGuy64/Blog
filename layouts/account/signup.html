{{ define "main" }}
  <h1>{{ .Title }}</h1>
  <div class="fz-account-page" id="signupBox">
    <p class="fz-muted">Loading…</p>
  </div>
  <script>
  (function(){
    const F=window.Fazon, el=F.el, box=document.getElementById("signupBox");
    let next="/";
    try{ next=F.safePath(new URLSearchParams(location.search).get("next")||"")||"/"; }catch(e){}
    if(next.indexOf("/account/")===0) next="/";   // don't bounce back to login/sign-up pages
    const loginLink=text=>el("a",{href:F.loginHref(next),text});
    const runes=s=>Array.from(s).length;
    // the server's rules (db.NormalizeName): 1–40 characters, no control or bidi-override characters
    const badChar=c=>{ const n=c.codePointAt(0); return n<0x20||(n>=0x7f&&n<=0x9f)||(n>=0x202a&&n<=0x202e)||(n>=0x2066&&n<=0x2069); };
    const nameErr=v=>!v||runes(v)>40?"Display names are 1–40 characters.":
      Array.from(v).some(badChar)?"That name has characters that aren't allowed.":"";

    function form(){
      const email=el("input",{class:"fz-input",type:"email",id:"suEmail",name:"email",required:true,
        autocomplete:"email",placeholder:"you@example.com"});
      const name=el("input",{class:"fz-input",type:"text",id:"suName",name:"name",required:true,maxlength:"80",
        autocomplete:"nickname",placeholder:"How your name shows on comments"});
      // honeypot: off-screen and skipped by keyboard and screen readers; people leave it empty
      const trap=el("input",{type:"text",id:"suWebsite",name:"website",tabindex:"-1",autocomplete:"off"});
      const btn=el("button",{class:"fz-btn primary",type:"submit",text:"Sign up"});
      const err=el("p",{class:"fz-error",role:"alert"});
      const f=el("form",{class:"fz-form",novalidate:true},
        el("label",{for:"suEmail",text:"Email"}), email,
        el("label",{for:"suName",text:"Display name"}), name,
        el("div",{class:"fz-hp","aria-hidden":"true"},el("label",{for:"suWebsite",text:"Website (leave empty)"}),trap),
        el("p",{class:"fz-muted fz-fine"},"By signing up you agree to how we handle your data — ",
          el("a",{href:"/privacy/",text:"Privacy"}),"."),
        el("div",{class:"fz-row"},btn), err);
      f.addEventListener("submit",e=>{
        e.preventDefault();
        const ev=email.value.trim(), nv=name.value.trim();
        err.textContent="";
        if(!ev||!email.checkValidity()){ err.textContent="Enter a valid email address."; email.focus(); return; }
        const ne=nameErr(nv); if(ne){ err.textContent=ne; name.focus(); return; }
        btn.disabled=true; btn.textContent="Sending…";
        F.api("/v1/auth/signup",{method:"POST",body:{email:ev,name:nv,next,website:trap.value}}).then(()=>{
          box.textContent="";
          box.append(
            el("p",{class:"fz-note"},"Check your email: we've sent a link to ",el("b",{text:ev}),
              ". Open it to finish creating your account (it works for an hour)."),
            el("p",{class:"fz-muted",text:"If that address already has an account, the email has a login link instead. Didn't get anything? Check spam, or "},
              el("a",{href:location.pathname+location.search,text:"try again"}),"."));
        },e2=>{ err.textContent=e2.message; btn.disabled=false; btn.textContent="Sign up"; });
      });
      box.textContent="";
      box.append(
        el("p",{text:"Create an account to comment, like comments and log your immersion on Track. There's no password: we email you a link to confirm, and later ones to log in."}),
        f,
        el("p",{class:"fz-switch"},"Already have an account? ",loginLink("Log in")));
      email.focus();
    }

    F.me().then(m=>{
      if(m.user){
        box.textContent="";
        box.append(el("p",{class:"fz-note"},"You're already logged in as ",el("b",{text:m.user.name}),"."),
          el("p",{},el("a",{href:next,text:next==="/"?"← Back to the home page":"← Back to where you were"})));
      } else form();
    });
  })();
  </script>
{{ end }}
