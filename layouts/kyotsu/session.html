{{ define "main" }}
  <link rel="stylesheet" href="{{ relURL "css/kyotsu.css" }}">
  <div class="kyotsu-wordmark jp">京ツ</div>
  <h1>{{ .Title }}</h1>

  <div class="kyotsu-quiz ks-page" id="ks">
    <p class="ks-msg" id="ksMsg">Loading…</p>
  </div>
  <p class="kyotsu-note w-hide"><a href="{{ relURL "kyotsu/" }}">← Back to the trainer</a></p>

  <script>
  (function(){
    const F=window.Fazon, el=F.el, esc=F.esc, root=document.getElementById("ks");

    // same buckets/labels as the trainer (layouts/kyotsu/section.html): Keihan's 式 × 核, Tokyo's (kotu.io's) three
    const CATS=[
      {id:"HM",jp:"高起無核",en:"High · flat",     eg:"HHHH"},
      {id:"HA",jp:"高起頭核",en:"High · head drop",eg:"HLLL"},
      {id:"HN",jp:"高起中核",en:"High · mid drop", eg:"HHLL"},
      {id:"HO",jp:"高起尾核",en:"High · tail drop",eg:"HHH↘"},
      {id:"LM",jp:"低起無核",en:"Low · rise",      eg:"LLLH"},
      {id:"LA",jp:"低起頭核",en:"Low · flat",      eg:"LLLL"},
      {id:"LN",jp:"低起中核",en:"Low · mid drop",  eg:"LHLL"},
      {id:"LO",jp:"低起尾核",en:"Low · tail drop", eg:"LLH↘"},
    ];
    const CATS_T=[
      {id:"TH",jp:"平板・尾高",en:"Heiban / Odaka",eg:"LHHH"},
      {id:"TA",jp:"頭高",     en:"Atamadaka",     eg:"HLLL"},
      {id:"TN",jp:"中高",     en:"Nakadaka",      eg:"LHLL"},
    ];
    const SPEAKERS={yura:"彩森遊楽 (Kobe)",nagi:"月野ナギ (Kyoto)",otowa:"音羽咲夜 (Nara)",atsuzaki:"厚崎ゆうま (Shiga/Osaka)",nhk:"NHK (Tokyo)"};
    const MODES={keihan:"Keihan",tokyo:"Tokyo (標準語)"};
    const modeOf=s=>s&&s.mode==="tokyo"?"tokyo":"keihan";   // older sessions have no mode: Keihan
    const LAYOUTS={kotu:"Kotu-style",classic:"Pitch Graph"};

    const SMALL=new Set([..."ャュョァィゥェォヮゃゅょぁぃぅぇぉゎ゚"]);   // ゚ (U+309A, nasal カ゚) joins the mora before it too
    function moras(reading){
      const out=[];
      for(const ch of reading){ if(SMALL.has(ch)&&out.length) out[out.length-1]+=ch; else out.push(ch); }
      return out;
    }
    // Kotu-style overline (as in the trainer), but every mora is escaped — readings come from the API
    function overline(reading, pattern){
      const ms=moras(String(reading||"")), hs=[], drop=new Set();
      for(const c of String(pattern||"")){ if(c==="H"||c==="L") hs.push(c==="H"); else if(c==="↘"||c==="↓") drop.add(hs.length-1); }
      return `<span class="kword jp">`+ms.map((m,i)=>{
        const hi=hs[i], dn=hi&&(drop.has(i)||(i<hs.length-1&&!hs[i+1]));
        return `<span class="m${hi?" hi":""}${dn?" dn":""}">${esc(m)}</span>`;
      }).join("")+`</span>`;
    }
    const pct=(c,t)=>t?Math.round(c/t*100):0;
    const fmtDate=iso=>{ const d=new Date(iso); return isNaN(d)?"—":d.toLocaleString(undefined,{weekday:"short",year:"numeric",month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}); };
    const shortDate=iso=>{ const d=new Date(iso); return isNaN(d)?"":d.toLocaleDateString(undefined,{month:"short",day:"numeric"}); };
    function duration(a,b){
      const ms=new Date(b)-new Date(a); if(!(ms>=0)) return "—";
      const m=Math.round(ms/60000); if(m<1) return "under a minute";
      return m<60?`${m} min`:`${Math.floor(m/60)} h ${String(m%60).padStart(2,"0")} min`;
    }
    const panel=(title,...kids)=>el("section",{class:"panel w-sec"},el("div",{class:"panel-h w-sec-h",text:title}),...kids);
    const wide=()=>!!(window.FazonWide&&FazonWide.active());
    function html(tag,cls,markup){ const n=el(tag,{class:cls}); n.innerHTML=markup; return n; }  // markup built with esc()
    function msg(...parts){ root.textContent=""; root.appendChild(el("p",{class:"ks-msg"},...parts)); }

    function summary(s){
      const big=el("div",{class:"ks-acc"},
        el("div",{class:"ks-acc-n",text:s.total?pct(s.correct,s.total)+"%":"—"}),
        el("div",{class:"ks-acc-f mono",text:`${s.correct} / ${s.total} correct`}));
      const active=s.active_seconds>0;   // 0 = saved by an older trainer, which didn't measure it
      const dl=el("dl",{class:"ks-facts"},
        el("dt",{text:"Mode"}),el("dd",{text:MODES[modeOf(s)]}),
        el("dt",{text:"Date"}),el("dd",{text:fmtDate(s.started)}),
        el("dt",{text:"Duration"}),el("dd",{text:duration(s.started,s.ended)}),
        ...(active?[el("dt",{text:"Practice time"}),el("dd",{class:"mono",text:fmtClock(s.active_seconds)})]:[]),
        el("dt",{text:"Layout"}),el("dd",{text:LAYOUTS[s.layout]||s.layout||"—"}),
        el("dt",{text:"Advanced Mode"}),el("dd",{text:s.advanced?"On":"Off"}));
      return panel("This session",el("div",{class:"ks-sum"},big,dl,active?trackNote(s):null));
    }

    // what the session's practice time did on the user's Track (the server's record of it)
    const fmtClock=sec=>{ const t=Math.round(sec), h=Math.floor(t/3600), m=Math.floor(t/60)%60, ss=String(t%60).padStart(2,"0");
      return h?`${h}:${String(m).padStart(2,"0")}:${ss}`:`${m}:${ss}`; };
    const fmtMin=h=>{ const m=Math.round(h*60); return m<60?`${m} min`:`${Math.floor(m/60)} h ${String(m%60).padStart(2,"0")} min`; };
    // Track weeks run Sunday 03:00 UTC → Sunday 03:00 UTC, keyed by the Saturday before (internal/week)
    function weekKey(ms){ const d=new Date(ms-3*3600e3); d.setUTCDate(d.getUTCDate()-(d.getUTCDay()+1)); return d.toISOString().slice(0,10); }
    const fmtKey=k=>new Date(k+"T00:00:00Z").toLocaleDateString(undefined,{day:"numeric",month:"short",timeZone:"UTC"});
    function trackNote(s){
      const t=s.track_added, box=el("div",{class:"ks-track"});
      if(!t){ box.append(el("p",{text:"Under half a minute of practice, so nothing was added to your Track."})); return box; }
      const cur=t.week===weekKey(Date.now());
      if(t.hours>0){
        box.append(el("p",{},"Added ",el("b",{text:fmtMin(t.hours)})," to ",
          el("b",{text:"Phonetic training › "+(t.subcat!=null?t.subcat:"Other / unassigned")}),
          cur?" for this week. ":` for the week of ${fmtKey(t.week)}. `,
          el("a",{href:cur?"/track/":"/track/?week="+encodeURIComponent(t.week),text:"View in Track →"})));
      }
      if(t.note) box.append(el("p",{class:"ks-track-note",text:t.note}));
      return box;
    }

    function patternStats(answers,cats){
      const by={}; answers.forEach(a=>{ const r=by[a.cat]||(by[a.cat]={c:0,t:0}); r.t++; if(a.ok) r.c++; });
      if(wide()) return panel("Pattern Stats",html("div","",cats.some(c=>by[c.id])?`<table class="w-table kq-pat"><thead><tr><th>Pattern</th><th>Shape</th><th class="num">Right</th><th class="num">%</th></tr></thead><tbody>`+
        cats.filter(c=>by[c.id]).map(c=>{ const r=by[c.id];
          return `<tr data-tip="${esc(c.jp)}"><td>${esc(c.en)}</td><td>${overline("◯".repeat(c.eg.replace(/[↘↓]/g,"").length),c.eg)}</td><td class="num">${r.c}/${r.t}</td><td class="num">${pct(r.c,r.t)}</td></tr>`; }).join("")+
        `</tbody></table>`:`<p class="ks-empty">No answers.</p>`));
      const rows=cats.filter(c=>by[c.id]).map(c=>{ const r=by[c.id];
        return `<div class="pat-row"><div><div class="pat-k">${esc(c.en)} <span class="jp">${esc(c.jp)}</span></div>${overline("◯".repeat(c.eg.replace(/[↘↓]/g,"").length),c.eg)}</div>`+
          `<span class="pat-n">${r.c} of ${r.t} (${pct(r.c,r.t)}%)</span></div>`; }).join("");
      return panel("Pattern Stats",html("div","",rows||`<p class="ks-empty">No answers.</p>`));
    }

    function speakerStats(answers){
      // speaker ids come from the saved session: no prototype keys ("__proto__", "constructor")
      const by=Object.create(null), order=[], known=k=>Object.prototype.hasOwnProperty.call(SPEAKERS,k);
      answers.forEach(a=>{ const k=String(a.speaker||"?"); if(!by[k]){ by[k]={c:0,t:0}; order.push(k); } by[k].t++; if(a.ok) by[k].c++; });
      const ids=Object.keys(SPEAKERS).filter(k=>by[k]).concat(order.filter(k=>!known(k)));
      const rows=ids.map(k=>{ const r=by[k], p=pct(r.c,r.t);
        return el("div",{class:"ks-spk"},
          el("div",{class:"ks-spk-top"},el("span",{class:"jp",text:known(k)?SPEAKERS[k]:k}),el("span",{class:"pat-n",text:`${r.c} of ${r.t} (${p}%)`})),
          el("div",{class:"ks-bar"},el("span",{style:`width:${p}%`}))); });
      return panel("By speaker",...(rows.length?rows:[el("p",{class:"ks-empty",text:"No answers."})]));
    }

    function missed(answers){
      const groups=new Map();
      answers.filter(a=>!a.ok).forEach(a=>{ const k=[a.reading,a.surface,a.pattern].join("\u0000");
        const g=groups.get(k); if(g) g.n++; else groups.set(k,{a,n:1}); });
      if(!groups.size) return panel("Missed words",el("p",{class:"ks-empty",text:"None — every answer was right."}));
      const list=el("div",{class:"ks-missed"});
      [...groups.values()].sort((x,y)=>y.n-x.n).forEach(({a,n})=>{
        list.appendChild(html("div","ks-miss",
          `<span class="ks-miss-w">${overline(a.reading,a.pattern)}</span>`+
          `<span class="ks-miss-s jp">${esc(a.surface)}</span>`+
          `<span class="ks-miss-p mono">${esc(a.reading)} · ${esc(a.pattern)}</span>`+
          (n>1?`<span class="ks-miss-n mono">×${n}</span>`:"")));
      });
      const total=answers.filter(a=>!a.ok).length;
      return panel(`Missed words (${total})`,list);
    }

    // ---- wide: missed words as a table with replay, a stat strip, panes ----
    // Saved answers don't name their clip, so replay finds it from the reading: quiz_data.js for
    // Keihan (loaded only here, standard doesn't need it), the API's sets for Tokyo.
    const AUDIO_BASE="{{ relURL "kyotsu/audio/" }}", QUIZ_SRC="{{ relURL "kyotsu/quiz_data.js" }}";
    const VOICE_DIR={yura:"",nagi:"nagi/",otowa:"otowa/",atsuzaki:"atsuzaki/"};
    const clipIndex={keihan:null,tokyo:null};
    function loadClips(mode){
      if(clipIndex[mode]) return clipIndex[mode];
      if(mode==="tokyo") return clipIndex.tokyo=F.api("/v1/hyojungo/pairs").then(d=>{ const m=new Map();
        ((d&&d.pairs)||[]).forEach(p=>(p.m||[]).forEach(x=>m.set(x.pron+"\u0000"+x.pat,x.a))); return m; });
      return clipIndex.keihan=new Promise((ok,no)=>{ const t=document.createElement("script"); t.src=QUIZ_SRC; t.onload=ok; t.onerror=no; document.head.append(t); })
        .then(()=>{ const m=new Map(); QUIZ.forEach(p=>p.members.forEach(x=>m.set(p.reading+"\u0000"+x.surface,x.audio))); return m; });
    }
    let audioEl=null;
    function replay(url){ audioEl=audioEl||new Audio(); audioEl.src=url; audioEl.currentTime=0; audioEl.play().catch(()=>{}); }
    function missedTable(answers,cats,mode){
      const groups=new Map();
      answers.filter(a=>!a.ok).forEach(a=>{ const k=[a.reading,a.surface,a.pattern].join("\u0000");
        const g=groups.get(k); if(g){ g.n++; g.v.add(a.speaker); } else groups.set(k,{a,n:1,v:new Set([a.speaker])}); });
      const total=answers.filter(a=>!a.ok).length;
      if(!groups.size) return panel("Missed words",el("p",{class:"ks-empty",text:"None — every answer was right."}));
      const voice=id=>String(SPEAKERS[id]||id||"?").replace(/ \(.*/,"");
      const body=el("tbody");
      [...groups.values()].sort((x,y)=>y.n-x.n).forEach(({a,n,v})=>{
        const tr=el("tr"), cat=cats.find(c=>c.id===a.cat), btn=el("button",{type:"button",class:"w-btn sm ks-replay",hidden:true,"aria-label":"Replay "+a.surface,text:"▶"});
        tr.innerHTML=`<td></td><td class="ks-t-w">${overline(a.reading,a.pattern)}</td><td class="jp ks-t-s">${esc(a.surface)}</td><td class="mono">${esc(a.pattern)}</td>`+
          `<td>${esc(cat?cat.en:a.cat||"")}</td><td class="jp">${esc([...v].map(voice).join(", "))}</td><td class="num">${n}</td>`;
        tr.firstChild.append(btn); body.append(tr);
        loadClips(mode).then(m=>{
          const id=m.get(mode==="tokyo"?a.reading+"\u0000"+a.pattern:a.reading+"\u0000"+a.surface); if(!id) return;
          const url=mode==="tokyo"?F.base+"/v1/hyojungo/audio/"+encodeURIComponent(id)+".aac":AUDIO_BASE+(VOICE_DIR[a.speaker]||"")+encodeURIComponent(id)+".mp3";
          btn.hidden=false; btn.onclick=()=>replay(url);
        },()=>{});
      });
      const table=el("table",{class:"w-table ks-t"});
      table.innerHTML=`<thead><tr><th aria-label="Replay"></th><th>Word</th><th>Kanji</th><th>Pitch</th><th>Pattern</th><th>Voice</th><th class="num">Missed</th></tr></thead>`;
      table.append(body);
      return panel(`Missed words (${total})`,table);
    }
    function strip(s){
      const active=s.active_seconds>0;
      const stat=(v,k)=>el("div",{class:"w-stat"},el("b",{text:v}),el("span",{text:k}));
      return el("div",{class:"ks-strip"},
        el("div",{class:"w-stats"},stat(s.total?pct(s.correct,s.total)+"%":"—","accuracy"),stat(`${s.correct} / ${s.total}`,"correct"),
          stat(duration(s.started,s.ended),"duration"),...(active?[stat(fmtClock(s.active_seconds),"practice time")]:[]),stat(MODES[modeOf(s)],"mode")),
        el("div",{class:"ks-strip-m"},el("p",{class:"ks-meta",text:`${fmtDate(s.started)} · ${LAYOUTS[s.layout]||s.layout||"—"} · Advanced Mode ${s.advanced?"on":"off"}`}),active?trackNote(s):null));
    }
    function barNav(same,curId){
      const tools=FazonWide.tools(); tools.textContent="";
      const at=same.findIndex(x=>x.id===curId), older=same[at-1], newer=same[at+1];
      const link=(to,label,key,tip)=>to?el("a",{class:"w-btn",href:`?id=${to.id}`,"data-tip":tip,text:label},el("kbd",{text:key})):el("span",{class:"w-btn ks-off","aria-disabled":"true",text:label});
      if(at>=0) tools.append(el("span",{class:"ks-pos",text:`Session ${at+1} of ${same.length}`}),link(older,"Older","[","Previous session"),link(newer,"Newer","]","Next session"));
      FazonWide.key("[","Previous session",()=>{ if(older) location.href=`?id=${older.id}`; });
      FazonWide.key("]","Next session",()=>{ if(newer) location.href=`?id=${newer.id}`; });
    }

    // ---- over time: accuracy per session, inline SVG sized to the panel ----
    const SVGNS="http://www.w3.org/2000/svg";
    function svg(tag,attrs,text){ const n=document.createElementNS(SVGNS,tag);
      for(const k in attrs) n.setAttribute(k,attrs[k]); if(text!=null) n.textContent=text; return n; }
    function drawChart(box,sessions,curId){
      box.textContent="";
      const W=Math.max(260,box.clientWidth), narrow=W<480, H=narrow?190:220;
      const pad={l:38,r:14,t:12,b:28}, pw=W-pad.l-pad.r, ph=H-pad.t-pad.b;
      const n=sessions.length, maxT=Math.max(1,...sessions.map(s=>s.total));
      const x=i=>pad.l+(n===1?pw/2:i*pw/(n-1)), y=p=>pad.t+ph*(1-p/100);
      const s=svg("svg",{width:W,height:H,viewBox:`0 0 ${W} ${H}`,class:"ks-chart",role:"img",
        "aria-label":`Accuracy per session, ${n} session${n===1?"":"s"}`});
      [0,25,50,75,100].forEach(v=>{
        s.appendChild(svg("line",{x1:pad.l,x2:W-pad.r,y1:y(v),y2:y(v),class:"ks-gl"}));
        s.appendChild(svg("text",{x:pad.l-6,y:y(v)+4,"text-anchor":"end",class:"ks-axis"},v+"%"));
      });
      // faint answer-count bars along the bottom (tallest = 25% of the plot)
      const bw=Math.max(2,Math.min(14,pw/Math.max(n,1)*0.5));
      sessions.forEach((r,i)=>{ const bh=ph*0.25*r.total/maxT;
        const b=svg("rect",{x:x(i)-bw/2,y:pad.t+ph-bh,width:bw,height:bh,class:"ks-count"});
        b.appendChild(svg("title",{},`${r.total} answers`)); s.appendChild(b); });
      // x labels: as many dates as fit
      const every=Math.max(1,Math.ceil(n/Math.max(1,Math.floor(pw/(narrow?62:78)))));
      sessions.forEach((r,i)=>{ if(i%every===0||(i===n-1&&n>1&&(n-1)%every>=every/2))
        s.appendChild(svg("text",{x:x(i),y:H-8,"text-anchor":n===1?"middle":i===0?"start":i===n-1?"end":"middle",class:"ks-axis"},shortDate(r.started))); });
      if(n>1) s.appendChild(svg("polyline",{points:sessions.map((r,i)=>`${x(i)},${y(pct(r.correct,r.total))}`).join(" "),class:"ks-line"}));
      sessions.forEach((r,i)=>{
        const cur=r.id===curId, p=pct(r.correct,r.total);
        const a=svg("a",{href:`?id=${r.id}`,class:"ks-pt"+(cur?" cur":"")});
        if(cur) a.appendChild(svg("circle",{cx:x(i),cy:y(p),r:9,class:"ks-halo"}));
        a.appendChild(svg("circle",{cx:x(i),cy:y(p),r:cur?5.5:3.5,class:"ks-dot"}));
        a.appendChild(svg("circle",{cx:x(i),cy:y(p),r:12,class:"ks-hit"}));   // bigger tap target
        a.appendChild(svg("title",{},`Session ${i+1} · ${fmtDate(r.started)}\n${p}% (${r.correct}/${r.total})${cur?" · this session":""}`));
        s.appendChild(a);
      });
      box.appendChild(s);
    }

    // sessions: only the shown session's mode (Keihan and Tokyo accuracies don't compare); other =
    // the latest session in the other mode, linked at the foot
    function overTime(sessions,curId,mode,other){
      const tA=sessions.reduce((a,s)=>a+s.total,0), tC=sessions.reduce((a,s)=>a+s.correct,0);
      const totals=el("div",{class:"ks-totals"},
        ...[[sessions.length,"sessions"],[tA,"answers"],[tA?pct(tC,tA)+"%":"—","overall accuracy"]].map(([v,k])=>
          el("div",{},el("b",{class:"mono",text:String(v)}),el("span",{text:k}))));
      const chart=el("div",{class:"ks-chart-box"});
      const list=el("ol",{class:"ks-list",reversed:true});
      const rows=sessions.map((s,i)=>({s,i})).reverse();
      const SHOW=15; let shown=0;
      function more(){
        rows.slice(shown,shown+=SHOW).forEach(({s,i})=>{
          const cur=s.id===curId;
          list.appendChild(el("li",{class:cur?"cur":""},
            el("a",{href:`?id=${s.id}`},
              el("span",{class:"ks-l-n mono",text:`#${i+1}`}),
              el("span",{class:"ks-l-d",text:fmtDate(s.started)}),
              el("span",{class:"ks-l-m",text:(LAYOUTS[s.layout]||s.layout||"")+(s.advanced?" · Advanced":"")}),
              el("span",{class:"ks-l-p mono",text:`${s.correct}/${s.total} · ${pct(s.correct,s.total)}%`}))));
        });
        moreBtn.hidden=shown>=rows.length;
      }
      const moreBtn=el("button",{type:"button",class:"ks-more",text:"Show older sessions",onclick:more});
      more();
      const p=panel("Over time · "+MODES[mode].replace(/ .*/,""),wide()?el("div",{class:"ks-t-head"},totals,other?el("a",{href:`?id=${other.id}`,text:`Your ${MODES[modeOf(other)].replace(/ .*/,"")} sessions →`}):null):totals,chart,el("div",{class:"panel-sep"}),list,moreBtn,
        other&&!wide()?el("p",{class:"ks-other"},el("a",{href:`?id=${other.id}`,text:`Your ${MODES[modeOf(other)].replace(/ .*/,"")} sessions →`})):null);
      // draw once it's in the DOM (needs the width), and again on resize / theme switch
      requestAnimationFrame(()=>drawChart(chart,sessions,curId));
      let w=0; new ResizeObserver(()=>{ if(chart.clientWidth!==w){ w=chart.clientWidth; drawChart(chart,sessions,curId); } }).observe(chart);
      return p;
    }

    F.me().then(m=>{
      if(m.offline){ msg("Couldn't reach the server. Try again in a moment."); return; }
      if(!m.user){ msg(el("a",{href:F.loginHref(),text:"Log in"})," to see your saved sessions."); return; }
      const idq=new URLSearchParams(location.search).get("id");
      const id=idq&&/^\d+$/.test(idq)?+idq:null;
      return F.api("/v1/kyotsu/sessions").then(d=>{
        const sessions=((d&&d.sessions)||[]).slice();
        if(!sessions.length&&id==null){ msg("No saved sessions yet. Answer a few words in the trainer, then press “End session”."); return; }
        const want=id!=null?id:sessions[sessions.length-1].id;
        return F.api("/v1/kyotsu/sessions/"+want).then(s=>{
          const answers=Array.isArray(s.answers)?s.answers:[];
          const mode=modeOf(s), same=sessions.filter(x=>modeOf(x)===mode), other=sessions.filter(x=>modeOf(x)!==mode).pop();
          const cats=mode==="tokyo"?CATS_T:CATS;
          function render(){
            root.textContent="";
            if(wide()){
              barNav(same,s.id);
              root.append(el("div",{class:"w-panes w-insp ks-wide"},
                el("div",{class:"w-pane ks-work"},strip(s),missedTable(answers,cats,mode),overTime(same,s.id,mode,other)),
                el("div",{class:"w-pane ks-side"},patternStats(answers,cats),speakerStats(answers))));
              return;
            }
            const grid=el("div",{class:"ks-grid"},
              el("div",{class:"ks-col"},summary(s),missed(answers)),
              el("div",{class:"ks-col"},patternStats(answers,cats),speakerStats(answers)));
            root.append(grid,overTime(same,s.id,mode,other));
          }
          render();
          document.addEventListener("fz-layout",e=>{ if(!e.detail.wide) FazonWide.tools().textContent=""; render(); });
        },e=>{
          if(e.status===404) msg("That session wasn't found. ",el("a",{href:"?",text:"Show your latest session"}),".");
          else msg(e.message);
        });
      },e=>msg(e.status===401?"Your login has expired. ":e.message+" ",e.status===401?el("a",{href:F.loginHref(),text:"Log in again"}):""));
    });
  })();
  </script>
{{ end }}
