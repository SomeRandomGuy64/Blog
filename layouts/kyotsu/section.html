{{ define "main" }}
  <link rel="stylesheet" href="{{ relURL "css/kyotsu.css" }}">
  <div class="kyotsu-wordmark jp">京ツ</div>
  <h1>{{ .Title }}</h1>
  {{ with .Content }}{{ . }}{{ end }}

  <div class="kyotsu-quiz">
    <div class="score">
      <div class="cell"><div class="n" id="sCorrect">0</div><div class="k">Correct</div></div>
      <div class="cell"><div class="n" id="sTotal">0</div><div class="k">Answered</div></div>
      <div class="cell"><div class="n acc" id="sAcc">—</div><div class="k">Accuracy</div></div>
    </div>

    <div class="card">
      <div class="prompt">
        <div class="reading jp" id="reading">—</div>
        <div class="hint">Which of the two words is this?</div>
        <div class="voicechip"><span class="dot"></span><span id="voiceName">—</span></div>
      </div>
      <div class="play">
        <button class="playbtn" id="playBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>Play word</button>
      </div>

      <div class="q">Tap the word you heard</div>
      <div class="options" id="options"></div>

      <div class="verdict" id="verdict"></div>
      <div class="reveal" id="reveal"></div>
      <div class="next"><button class="nextbtn" id="nextBtn" hidden>Next word →</button></div>
    </div>

    <p class="kyotsu-note">
      After you answer, tap either word to replay it.<br>
      <span id="qStats"></span>Keihan pitch. Pitch shown high/low per mora, ˺ marks a downstep.
    </p>
  </div>

  <script src="{{ relURL "kyotsu/quiz_data.js" }}"></script>
  <script>
  (function(){
    const AUDIO_BASE="{{ relURL "kyotsu/audio/" }}";
    // A speaker is picked at random for each question; the audio and the shown pitch
    // both come from that speaker. `overrides` = clips a speaker produced with a
    // different pitch than the reference (keyed by audio id).
    const SPEAKERS=[
      {id:"yura", label:"彩森遊楽 (Kobe)",  base:AUDIO_BASE,
        // her own Kobe pitch where it differs from the stored base (user ear-check 2026-10-03)
        overrides:{"058A":"HHL","067A":"HL","097A":"HHL","081A":"LHHL","152A":"HLL","077A":"LLLH","075A":"LLH"}},
      {id:"nagi", label:"月野ナギ (Kyoto)", base:AUDIO_BASE+"nagi/", overrides:{
        // her personal deviations from the reference
        "001A":"LLHL","089A":"LLHL","152B":"HLL",
        // the Kobe-divergent (hyogo) pairs restored to their base Kyoto pitch
        "009A":"HHH","021A":"LHL","103A":"LLH","157A":"HLL","221B":"LH↘","248B":"LLH","278B":"LH"}},
      {id:"otowa", label:"音羽咲夜 (Nara)", base:AUDIO_BASE+"otowa/", overrides:{
        // Kyoto speaker: the Kobe-divergent (hyogo) base pairs restored to Kyoto pitch
        // (per the 84k Kinki dictionary).
        "009A":"HHH","021A":"LHL","103A":"LLH","157A":"HLL","221B":"LH↘","278B":"LH",
        // her own pitch where it differs from the reference (user ear-check 2026-10-03)
        "221A":"LL","178A":"LLHH","152B":"HLL","233B":"LLH","227A":"LLH","131B":"LLH","159B":"LHL","097A":"LHL"}},
    ];
    const patternFor=(spk,m)=>(spk.overrides&&spk.overrides[m.audio])||m.pattern;
    const $=s=>document.querySelector(s);
    const rnd=n=>Math.floor(Math.random()*n);
    const SMALL=new Set([..."ャュョァィゥェォヮ"]);

    function moras(reading){
      const out=[];
      for(const ch of reading){ if(SMALL.has(ch)&&out.length) out[out.length-1]+=ch; else out.push(ch); }
      return out;
    }
    function contour(reading, pattern){
      const ms=moras(reading);
      const steps=[]; let drop=[];
      for(const c of pattern){ if(c==="H")steps.push(1); else if(c==="L")steps.push(0); else if(c==="↘")drop.push(steps.length-1); }
      const n=steps.length, endDrop=drop.includes(n-1), cols=n+(endDrop?1:0);
      const step=36, h=54, padX=16, padTop=8, padBot=30, w=Math.max(80,(cols-1)*step+2*padX);  // fixed mora spacing → identical rise/fall slope in every word
      const yH=padTop, yL=h-padBot, x=i=>(w-(cols-1)*step)/2+i*step;
      const y=i=>steps[i]?yH:yL;
      const pts=steps.map((s,i)=>`${x(i)},${y(i)}`).join(" ");
      let dots="", labels="", extra="";
      for(let i=0;i<n;i++){
        dots+=`<circle cx="${x(i)}" cy="${y(i)}" r="4.5" fill="${steps[i]?'var(--k-hi)':'var(--k-lo)'}"/>`;
        if(drop.includes(i)&&i<n-1) dots+=`<text class="mono" x="${x(i)+8}" y="${y(i)-6}" font-size="12" fill="var(--k-hi)">˺</text>`;
        labels+=`<text class="jp" x="${x(i)}" y="${h-9}" font-size="13" text-anchor="middle" fill="var(--k-muted)">${ms[i]||''}</text>`;
      }
      if(endDrop){const g=n;
        extra+=`<polyline points="${x(n-1)},${yH} ${x(g)},${yL}" fill="none" stroke="var(--k-hi)" stroke-width="2.5" stroke-dasharray="3 3" stroke-linecap="round" opacity=".7"/>`;
        extra+=`<circle cx="${x(g)}" cy="${yL}" r="4" fill="none" stroke="var(--k-lo)" stroke-width="1.5" opacity=".8"/>`;
        labels+=`<text x="${x(g)}" y="${h-9}" font-size="12" text-anchor="middle" fill="var(--k-muted)" opacity=".7">ꜜ</text>`;}
      return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
        <polyline points="${pts}" fill="none" stroke="var(--k-hi)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
        ${extra}${dots}${labels}</svg>`;
    }

    let cur=null, answered=false, correct=0, total=0, lastKey="";
    const audioEl=new Audio();
    function clipUrl(spk,m){ return spk.base + m.audio + ".mp3"; }
    function play(url){ audioEl.src=url; audioEl.currentTime=0; audioEl.play().catch(()=>{}); }
    let _preload=[];
    function preload(spk,pair){ _preload=pair.members.map(m=>{ const a=new Audio(); a.preload="auto"; a.src=clipUrl(spk,m); return a; }); }

    function newQuestion(){
      let pair, key;
      do{ pair=QUIZ[rnd(QUIZ.length)]; key=pair.reading; }while(QUIZ.length>1 && key===lastKey);
      lastKey=key;
      // a pair may restrict which speakers can voice it (e.g. 278 is Kobe-indiscernible)
      const allowed=pair.voices?SPEAKERS.filter(s=>pair.voices.includes(s.id)):SPEAKERS;
      const speaker=allowed[rnd(allowed.length)];
      const target=rnd(2);
      const order=Math.random()<.5?[0,1]:[1,0];
      cur={pair,target,order,speaker}; answered=false;

      $("#reading").textContent=pair.reading;
      $("#voiceName").textContent=speaker.label;
      $("#verdict").textContent=""; $("#verdict").className="verdict";
      $("#reveal").textContent=""; $("#nextBtn").hidden=true;

      const opts=$("#options"); opts.innerHTML="";
      order.forEach((mi,slot)=>{
        const m=pair.members[mi];
        const pat=patternFor(speaker,m);
        const el=document.createElement("button");
        el.className="opt"; el.dataset.mi=mi;
        el.innerHTML=`<div class="playicon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></div>`+
          `<div class="slot mono">${slot+1}</div>${contour(pair.reading,pat)}<div class="pat">${pat}</div>`;
        el.addEventListener("click",()=>{ if(!answered) choose(mi); else play(clipUrl(speaker,pair.members[mi])); });
        opts.appendChild(el);
      });
      preload(speaker,pair);
      setTimeout(()=>play(clipUrl(speaker,pair.members[target])),250);
    }

    function choose(mi){
      if(answered) return; answered=true;
      const {pair,target,speaker}=cur;
      total++; const ok=mi===target; if(ok)correct++;
      [...document.querySelectorAll(".opt")].forEach(b=>{ b.classList.add("answered");
        const bi=+b.dataset.mi;
        b.querySelector(".slot").outerHTML=`<div class="surface jp">${pair.members[bi].surface}</div>`;
        b.title="Play "+pair.members[bi].surface;
        if(bi===target) b.classList.add("correct");
        else if(bi===mi) b.classList.add("wrong");
      });
      const v=$("#verdict");
      v.textContent=ok?"Correct":"Not quite"; v.className="verdict "+(ok?"good":"bad");
      const t=pair.members[target];
      $("#reveal").innerHTML=`You heard <b class="jp">${t.surface}</b> · <span class="mono">${patternFor(speaker,t)}</span>, in ${speaker.label}'s voice`;
      $("#nextBtn").hidden=false; $("#nextBtn").focus();
      $("#sCorrect").textContent=correct; $("#sTotal").textContent=total;
      $("#sAcc").textContent=Math.round(correct/total*100)+"%";
    }

    $("#playBtn").addEventListener("click",()=>cur&&play(clipUrl(cur.speaker,cur.pair.members[cur.target])));
    $("#nextBtn").addEventListener("click",newQuestion);
    if(typeof QUIZ!=="undefined"){
      $("#qStats").textContent=`${QUIZ.length} minimal pairs · ${SPEAKERS.map(s=>s.label).join(" / ")}, random per word. `;
      newQuestion();
    }
  })();
  </script>
{{ end }}
