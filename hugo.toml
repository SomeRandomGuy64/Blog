baseURL = "https://fazon.nexus/"
locale = "en"
title = "Fazon Nexus"
enableRobotsTXT = true

[params]
  description = "Notes, logs, and tools from my Japanese language-learning journey — with the occasional WebGL experiment."
  author = "Faizan"
  # Accounts / comments / notifications / Kyōtsu sessions API (repo Fazon-Backend). On localhost the
  # client uses http://localhost:8091 instead (static/js/fazon-api.js).
  api = "https://api.fazon.nexus"
  # Shown on /privacy/ ("contact the site owner at …"); left empty, the page just says
  # "contact the site owner" (layouts/_shortcodes/contact.html).
  contactEmail = ""

# Allow raw HTML (e.g. <ruby> furigana) inside Markdown content.
[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false

[taxonomies]
  tag = "tags"
  category = "categories"

# Generate an RSS feed for the home page and each section (e.g. /articles/), plus
# /comment-pages.json: every page with a comment thread and its title. The API (repo Fazon-Backend) only
# accepts comments on those pages and takes their titles from there (layouts/home.commentpages.json).
[outputs]
  home = ["html", "rss", "commentpages"]
  section = ["html", "rss"]

[outputFormats.commentpages]
  mediaType = "application/json"
  baseName = "comment-pages"
  isPlainText = true
  notAlternative = true

[menu]
  [[menu.main]]
    name = "Articles"
    pageRef = "/articles"
    weight = 10
  [[menu.main]]
    name = "Kyotsu"
    pageRef = "/kyotsu"
    weight = 15
  [[menu.main]]
    name = "Track"
    pageRef = "/track"
    weight = 16
    # hidden until js/fazon-api.js confirms a logged-in user
    [menu.main.params]
      authOnly = true
  [[menu.main]]
    name = "Tools"
    pageRef = "/tools"
    weight = 18
  [[menu.main]]
    name = "About"
    pageRef = "/about"
    weight = 20
