baseURL = "https://fazon.nexus/"
locale = "en"
title = "Fazon Nexus"
enableRobotsTXT = true

[params]
  description = "Notes, logs, and tools from my Japanese language-learning journey — with the occasional WebGL experiment."
  author = "Faizan"
  # Accounts / comments / notifications / Kyōtsu sessions API (backend/). On localhost the
  # client uses http://localhost:8091 instead (static/js/fazon-api.js).
  api = "https://api.fazon.nexus"

# Allow raw HTML (e.g. <ruby> furigana) inside Markdown content.
[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false

[taxonomies]
  tag = "tags"
  category = "categories"

# Generate an RSS feed for the home page and each section (e.g. /articles/).
[outputs]
  home = ["html", "rss"]
  section = ["html", "rss"]

[menu]
  [[menu.main]]
    name = "Articles"
    pageRef = "/articles"
    weight = 10
  [[menu.main]]
    name = "Kyotsu"
    pageRef = "/kyotsu"
    weight = 15
  [[menu.main]]
    name = "Track"
    pageRef = "/track"
    weight = 16
  [[menu.main]]
    name = "Tools"
    pageRef = "/tools"
    weight = 18
  [[menu.main]]
    name = "About"
    pageRef = "/about"
    weight = 20
